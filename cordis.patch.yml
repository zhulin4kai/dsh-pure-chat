# Pure chat: a workspace-free preset plus the Host half that creates its
# sessions and stores one persona per session.
- insert:
    - id: pure-chat
      name: dsh-plugin-pure-chat

    - id: preset-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chat
        name: 纯对话
        description: 不绑定工作区，不加载本地工具，只保留联网搜索的对话模式。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '{{chat_persona}}'
              complete: true
              includeRuntimeContext: false
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
